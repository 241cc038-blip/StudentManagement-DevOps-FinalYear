services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studentdb
      POSTGRES_USER: studentadmin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_db_password}
    volumes:
      - student_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studentadmin -d studentdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql+psycopg://studentadmin:${POSTGRES_PASSWORD:-change_this_db_password}@db:5432/studentdb
      SECRET_KEY: ${SECRET_KEY:-change_this_secret_key}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  student_data:
