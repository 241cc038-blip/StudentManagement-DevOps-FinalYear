{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
<div class="card p-4">
<h2>Sign in</h2>
<form method="post">
  <label class="form-label mt-2">Username</label>
  <input class="form-control" name="username" autocomplete="username" required>
  <label class="form-label mt-3">Password</label>
  <input class="form-control" name="password" type="password" autocomplete="current-password" required>
  <button class="btn btn-primary mt-4 w-100">Login</button>
</form>
</div></div></div>
{% endblock %}
